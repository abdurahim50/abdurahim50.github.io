<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found</title>
<meta name="robots" content="noindex">
<!-- Absolute paths, no prefix: this is a user site served from the root of
     https://abdurahim50.github.io. They keep working unchanged on a custom
     domain, which also serves from the root. Only if you moved this into a
     project repo (served at /repo-name/) would these need a prefix. -->
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
(function(){var d=document.documentElement;try{d.setAttribute('data-theme',localStorage.getItem('theme')==='light'?'light':'dark');}catch(e){d.setAttribute('data-theme','dark');}})();
</script>
</head>
<body>
<main id="main">
  <section class="section" style="min-height:70vh;display:grid;place-items:center">
    <div class="wrap center">
      <p class="eyebrow" style="text-transform:none;letter-spacing:0">$ curl -I &mdash; 404 Not Found</p>
      <h1 style="font-size:clamp(3rem,12vw,6rem);margin-bottom:.25rem">404</h1>
      <p class="lede" style="margin-inline:auto">
        That page doesn't exist. It may have been renamed, or the link was wrong.
      </p>
      <div class="btn-row" style="justify-content:center">
        <a class="btn btn--primary" href="/">Back home</a>
        <a class="btn btn--ghost" href="/projects.html">Projects</a>
        <a class="btn btn--ghost" href="/writeups.html">Writing</a>
      </div>
    </div>
  </section>
</main>
<script src="/assets/js/main.js"></script>
</body>
</html>
